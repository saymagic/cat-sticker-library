name: 验收并发布表情作品库

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安装图片检查依赖
        run: python -m pip install -r deployment/requirements.txt
      - name: 设置发布提交身份
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: 完整验收并更新网站分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_pages.sh

name: 验收并发布表情作品库

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安装图片检查依赖
        run: python -m pip install -r deployment/requirements.txt
      - name: 测试版本约束和公开构建
        run: |
          python scripts/test_sticker_library.py
          python scripts/test_publish_library.py
      - name: 恢复Release物料并核对哈希
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_library.py restore
      - name: 完整核对生产文件和ZIP
        run: python scripts/sticker_library.py check --deep
      - name: 生成公开站点
        run: python scripts/publish_library.py build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
